<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Daby editorial insights</title><desc id="d">An editorial visual representing practical knowledge, reflection, business context and continuous learning.</desc><rect width="1400" height="760" rx="40" fill="#07111f"/><circle cx="1120" cy="140" r="230" fill="#16c9ee" opacity=".055"/><text x="90" y="110" fill="#fff" font-family="Arial" font-size="48" font-weight="700">Ideas that become usable English</text><text x="90" y="155" fill="#aebdce" font-family="Arial" font-size="20">Practical insights for meetings, leadership, careers and global work.</text><g font-family="Arial"><g transform="translate(90 250)"><rect width="360" height="350" rx="28" fill="#102236" stroke="#31506b"/><text x="35" y="70" fill="#16c9ee" font-size="18" font-weight="700">01 · NOTICE</text><text x="35" y="125" fill="#fff" font-size="30" font-weight="700">See the pattern</text><text x="35" y="175" fill="#aebdce" font-size="18">What keeps happening</text><text x="35" y="205" fill="#aebdce" font-size="18">in real professional</text><text x="35" y="235" fill="#aebdce" font-size="18">communication?</text></g><g transform="translate(520 250)"><rect width="360" height="350" rx="28" fill="#102236" stroke="#31506b"/><text x="35" y="70" fill="#16c9ee" font-size="18" font-weight="700">02 · REFRAME</text><text x="35" y="125" fill="#fff" font-size="30" font-weight="700">Understand why</text><text x="35" y="175" fill="#aebdce" font-size="18">Turn the situation</text><text x="35" y="205" fill="#aebdce" font-size="18">into a clearer</text><text x="35" y="235" fill="#aebdce" font-size="18">communication choice.</text></g><g transform="translate(950 250)"><rect width="360" height="350" rx="28" fill="#102236" stroke="#31506b"/><text x="35" y="70" fill="#16c9ee" font-size="18" font-weight="700">03 · APPLY</text><text x="35" y="125" fill="#fff" font-size="30" font-weight="700">Use it tomorrow</text><text x="35" y="175" fill="#aebdce" font-size="18">Take one idea</text><text x="35" y="205" fill="#aebdce" font-size="18">into the next</text><text x="35" y="235" fill="#aebdce" font-size="18">conversation.</text></g></g></svg>
