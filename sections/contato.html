<!-- sections/contato.html -->
<div class="contact-content">
    <h2 class="reveal-on-scroll">Fale Conosco</h2>
    <p class="section-subtext reveal-on-scroll">Estamos prontos para ajudar você a alcançar o próximo nível.</p>
    <div class="contact-form-container reveal-on-scroll">
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Profissional</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Telefone (com DDD)</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label for="message">Sua Mensagem</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn-primary magnetic">Enviar Mensagem</button>
        </form>
        <div class="contact-info">
            <h3>Informações de Contato</h3>
            <p>Email: <a href="mailto:contato@nextstationenglish.com">contato@nextstationenglish.com</a></p>
            <p>WhatsApp: <a href="https://wa.me/YOUR_WHATSAPP_NUMBER" target="_blank">Seu Número</a></p>
            <p>LinkedIn: <a href="YOUR_LINKEDIN_PROFILE_URL" target="_blank">Nosso Perfil</a></p>
            <p>Localização: São Paulo, Brasil</p>
        </div>
    </div>
</div>
