<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado! | Daby 2X</title>
    <meta name="description" content="Sua mensagem foi enviada com sucesso. Agradecemos seu contato com a Daby 2X.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Specific styles for the thank you page */
        .thank-you-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        .thank-you-container h1 {
            font-size: 3.5em;
            color: var(--electric-blue);
            margin-bottom: 20px;
        }
        .thank-you-container p {
            font-size: 1.3em;
            max-width: 700px;
            margin-bottom: 40px;
        }
        .thank-you-container .btn-primary {
            padding: 15px 30px;
            font-size: 1.1em;
        }
    </style>
</head>

<body>
    <!-- tsParticles container -->
    <div id="tsparticles" style="
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    "></div>

    <main class="thank-you-container">
        <h1>Obrigado pelo seu Contato!</h1>
        <p>Sua mensagem foi recebida com sucesso. Nossa equipe entrará em contato em breve para dar continuidade à sua solicitação.</p>
        <a href="index.html" class="btn-primary magnetic">Voltar para a Página Inicial</a>
    </main>

    <!-- JavaScript Files (only particles and magnetic needed for this page) -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script> <!-- Magnetic needs anime.js -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="assets/js/magnetic.js"></script>
    <script src="assets/js/particles.js"></script>
</body>

</html>
