<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Daby 2X method flow</title><desc id="d">Context, objective, language blocks, simulation and performance connected as a professional learning journey.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#16c9ee"/><stop offset="1" stop-color="#6d7cff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-opacity=".28"/></filter></defs><rect width="1600" height="760" rx="42" fill="#07111f"/><path d="M100 610 C420 420 620 690 900 470 S1260 350 1500 160" fill="none" stroke="url(#g)" stroke-width="3" opacity=".55"/><text x="100" y="105" fill="#f7fafc" font-family="Arial,sans-serif" font-size="46" font-weight="700">Daby 2X · From situation to performance</text><text x="100" y="150" fill="#aebdce" font-family="Arial,sans-serif" font-size="22">Train the language you actually need to use.</text><g filter="url(#s)"><g transform="translate(90 260)"><rect width="260" height="230" rx="28" fill="#102236" stroke="#1e4a67"/><circle cx="54" cy="54" r="27" fill="#0d5e7a"/><text x="54" y="63" text-anchor="middle" fill="#fff" font-size="24" font-family="Arial">01</text><text x="35" y="120" fill="#fff" font-size="28" font-weight="700" font-family="Arial">Context</text><text x="35" y="158" fill="#aebdce" font-size="18" font-family="Arial">What is happening?</text><text x="35" y="188" fill="#aebdce" font-size="18" font-family="Arial">Who is in the room?</text></g><g transform="translate(370 260)"><rect width="260" height="230" rx="28" fill="#102236" stroke="#1e4a67"/><circle cx="54" cy="54" r="27" fill="#0d5e7a"/><text x="54" y="63" text-anchor="middle" fill="#fff" font-size="24" font-family="Arial">02</text><text x="35" y="120" fill="#fff" font-size="28" font-weight="700" font-family="Arial">Objective</text><text x="35" y="158" fill="#aebdce" font-size="18" font-family="Arial">What needs to happen?</text><text x="35" y="188" fill="#aebdce" font-size="18" font-family="Arial">What is your role?</text></g><g transform="translate(650 260)"><rect width="260" height="230" rx="28" fill="#102236" stroke="#1e4a67"/><circle cx="54" cy="54" r="27" fill="#0d5e7a"/><text x="54" y="63" text-anchor="middle" fill="#fff" font-size="24" font-family="Arial">03</text><text x="35" y="120" fill="#fff" font-size="28" font-weight="700" font-family="Arial">Blocks</text><text x="35" y="158" fill="#aebdce" font-size="18" font-family="Arial">Build reusable language.</text><text x="35" y="188" fill="#aebdce" font-size="18" font-family="Arial">Connect ideas naturally.</text></g><g transform="translate(930 260)"><rect width="260" height="230" rx="28" fill="#102236" stroke="#1e4a67"/><circle cx="54" cy="54" r="27" fill="#0d5e7a"/><text x="54" y="63" text-anchor="middle" fill="#fff" font-size="24" font-family="Arial">04</text><text x="35" y="120" fill="#fff" font-size="28" font-weight="700" font-family="Arial">Simulation</text><text x="35" y="158" fill="#aebdce" font-size="18" font-family="Arial">Practise under pressure.</text><text x="35" y="188" fill="#aebdce" font-size="18" font-family="Arial">Adjust in real time.</text></g><g transform="translate(1210 260)"><rect width="260" height="230" rx="28" fill="#102236" stroke="#1e4a67"/><circle cx="54" cy="54" r="27" fill="#0d5e7a"/><text x="54" y="63" text-anchor="middle" fill="#fff" font-size="24" font-family="Arial">05</text><text x="35" y="120" fill="#fff" font-size="28" font-weight="700" font-family="Arial">Performance</text><text x="35" y="158" fill="#aebdce" font-size="18" font-family="Arial">Speak with presence.</text><text x="35" y="188" fill="#aebdce" font-size="18" font-family="Arial">Make the message land.</text></g></g><g fill="#16c9ee"><circle cx="350" cy="375" r="6"/><circle cx="630" cy="375" r="6"/><circle cx="910" cy="375" r="6"/><circle cx="1190" cy="375" r="6"/></g></svg>
