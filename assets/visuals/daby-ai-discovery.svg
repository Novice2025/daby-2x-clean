<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Daby AI discovery map</title><desc id="d">A visual map showing how clear official content connects people, search engines and AI systems.</desc><defs><radialGradient id="bg"><stop stop-color="#12304a"/><stop offset="1" stop-color="#07111f"/></radialGradient><linearGradient id="g"><stop stop-color="#16c9ee"/><stop offset="1" stop-color="#6d7cff"/></linearGradient></defs><rect width="1400" height="820" rx="40" fill="url(#bg)"/><text x="90" y="100" fill="#fff" font-family="Arial" font-size="46" font-weight="700">AI Discovery · be clear enough to be found</text><text x="90" y="145" fill="#aebdce" font-family="Arial" font-size="20">A structured reference helps people and intelligent systems understand what you do.</text><g stroke="url(#g)" stroke-width="3" fill="none" opacity=".6"><path d="M700 420L330 260M700 420L1070 260M700 420L330 590M700 420L1070 590"/></g><g font-family="Arial" text-anchor="middle"><circle cx="700" cy="420" r="125" fill="#0d2236" stroke="#16c9ee" stroke-width="3"/><text x="700" y="405" fill="#fff" font-size="30" font-weight="700">DABY</text><text x="700" y="440" fill="#16c9ee" font-size="22">OFFICIAL REFERENCE</text><text x="700" y="474" fill="#aebdce" font-size="15">identity · method · expertise</text><g><rect x="120" y="180" width="420" height="155" rx="25" fill="#0d2236" stroke="#31506b"/><text x="330" y="235" fill="#fff" font-size="27" font-weight="700">PEOPLE</text><text x="330" y="272" fill="#aebdce" font-size="17">Understand the offer and trust the source</text><rect x="860" y="180" width="420" height="155" rx="25" fill="#0d2236" stroke="#31506b"/><text x="1070" y="235" fill="#fff" font-size="27" font-weight="700">SEARCH</text><text x="1070" y="272" fill="#aebdce" font-size="17">Connect topics, pages and intent</text><rect x="120" y="520" width="420" height="155" rx="25" fill="#0d2236" stroke="#31506b"/><text x="330" y="575" fill="#fff" font-size="27" font-weight="700">AI SYSTEMS</text><text x="330" y="612" fill="#aebdce" font-size="17">Read consistent, authoritative references</text><rect x="860" y="520" width="420" height="155" rx="25" fill="#0d2236" stroke="#31506b"/><text x="1070" y="575" fill="#fff" font-size="27" font-weight="700">CONTENT</text><text x="1070" y="612" fill="#aebdce" font-size="17">Keep language, facts and links aligned</text></g></g></svg>
