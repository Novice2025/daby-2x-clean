<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d"><title id="t">Animated Daby signature</title><desc id="d">A refined animated Daby signature mark with a drawing effect.</desc><style>.sig{font:italic 150px 'Snell Roundhand','Segoe Script','Brush Script MT','URW Chancery L',cursive;fill:none;stroke:#f4f7fb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:write 2.2s cubic-bezier(.65,0,.35,1) forwards,fillin .7s 1.55s ease forwards}.line{stroke:#16c9ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:650;stroke-dashoffset:650;animation:draw 1.1s 1.6s ease forwards}.caption{font:500 13px Arial,sans-serif;letter-spacing:5px;fill:#aebdce;opacity:0;animation:fade .7s 2s ease forwards}@keyframes write{to{stroke-dashoffset:0}}@keyframes fillin{to{fill:#f4f7fb;stroke-opacity:.15}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@media(prefers-reduced-motion:reduce){.sig{animation:none;stroke-dashoffset:0;fill:#f4f7fb;stroke-opacity:.15}.line{animation:none;stroke-dashoffset:0}.caption{animation:none;opacity:1}}</style><text class="sig" x="80" y="165">vdaby</text><path class="line" d="M100 195 C250 235 430 225 760 180" fill="none"/><text class="caption" x="100" y="235">STRATEGIC ENGLISH · EXECUTIVE COMMUNICATION</text></svg>
